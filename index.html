<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A6DDF0">
<title>backpack · your homework buddy</title>
<meta name="description" content="backpack remembers your homework, tests and dates, tells you what to do tonight, and makes practice quizzes from your own homework.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M24 14v-3a8 8 0 0 1 16 0v3' fill='none' stroke='%2312301A' stroke-width='4'/%3E%3Crect x='12' y='14' width='40' height='44' rx='14' fill='%23FFD66B' stroke='%2312301A' stroke-width='4'/%3E%3Cpath d='M12 30c8 4 32 4 40 0' fill='none' stroke='%2312301A' stroke-width='4'/%3E%3Crect x='20' y='38' width='24' height='13' rx='5' fill='%23FFFBF1' stroke='%2312301A' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12301A; --ink-2:#2C4A36; --ink-3:#5B7563; --card:#FFFBF1; --line:#12301A;
    --green:#246E31; --green-soft:#DDF3D5; --sun:#FFD66B; --sun-soft:#FFF1C7;
    --red:#C8402F; --red-soft:#FCE3DD; --sky:#DCEFFA; --r:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;background:linear-gradient(180deg,#A6DDF0 0%,#CDEDF0 26%,#EAF6E6 52%,#EEF8E6 100%) fixed}
  .hills{position:fixed;left:0;right:0;bottom:0;height:150px;z-index:-1;pointer-events:none}
  .hills svg{width:100%;height:100%;display:block}
  button,input,select,textarea{font:inherit;color:inherit}
  h1,h2,.btn,.count b,.score,.label,.q,.tab,.next .t,.tcard b{font-family:Fredoka,Inter,sans-serif}
  svg{flex:none}
  .wrap{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 120px}

  header{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px}
  .logo{font-family:Pacifico,cursive;font-size:32px;line-height:1.5;color:var(--ink);text-decoration:none;padding:0 4px;background:none;border:0;cursor:pointer}
  .iconbtn{width:42px;height:42px;border-radius:14px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
  .iconbtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
  .hello{font-size:34px;font-weight:600;line-height:1.08;margin:0 0 6px;letter-spacing:-.01em}
  .lead{color:var(--ink-2);margin:0 0 20px;font-size:16px;line-height:1.5}

  .card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:0 5px 0 var(--line)}
  .card.note{background:var(--sun-soft);font-size:14.5px;line-height:1.45;padding:14px 16px}
  .card.note .link{padding:0 0 0 2px;font-weight:600;color:var(--ink)}
  .label{font-size:14px;font-weight:600;color:var(--ink-3);margin:0 0 10px;letter-spacing:.01em}
  h2{font-size:21px;font-weight:600;margin:0 0 4px;line-height:1.15}
  .muted{color:var(--ink-3);font-size:14px}

  .next{background:var(--ink);color:#fff}
  .next .label{color:#A9C6AF}
  .next .row{display:flex;align-items:center;gap:14px}
  .count{min-width:70px;height:70px;border-radius:18px;background:var(--sun);color:var(--ink);border:2px solid #0a1d10;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
  .count b{font-size:30px;line-height:1;font-weight:700}
  .count span{font-size:11.5px;font-weight:700}
  .next .t{font-weight:600;font-size:19px;line-height:1.15}
  .next .s{color:#A9C6AF;font-size:13.5px;margin-top:3px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);border-radius:999px;padding:13px 22px;font-weight:600;font-size:17px;cursor:pointer;background:var(--ink);color:#fff;width:100%;box-shadow:0 4px 0 var(--line);transition:transform .12s,box-shadow .12s}
  .btn:hover{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
  .btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .btn.light,.btn.white{background:var(--card);color:var(--ink)}
  .next .btn.white{border-color:#0a1d10;box-shadow:0 4px 0 #0a1d10}
  .btn.sm{padding:9px 18px;font-size:15px;width:auto}
  .link{background:none;border:0;color:var(--ink-2);cursor:pointer;font-size:14px;padding:6px;text-decoration:underline;text-underline-offset:3px}

  .try{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:8px}
  .tcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 4px 0 var(--line);cursor:pointer;transition:transform .12s,box-shadow .12s}
  .tcard:hover{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
  .tcard .ib{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;background:var(--sun)}
  .tcard.blue .ib{background:var(--sky)}
  .tcard b{font-size:16.5px;font-weight:600;line-height:1.15}
  .tcard span{font-size:13px;color:var(--ink-3);line-height:1.35}

  .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1.5px dashed rgba(18,48,26,.18)}
  .item:first-of-type{border-top:0;padding-top:2px}
  .chk{width:28px;height:28px;border-radius:10px;border:2px solid var(--line);background:#fff;flex:none;cursor:pointer;display:grid;place-items:center;padding:0}
  .chk.on{background:var(--green)}
  .item .main{flex:1;min-width:0;cursor:pointer}
  .item .t{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .s{font-size:13px;color:var(--ink-3);margin-top:1px}
  .item.done .t{text-decoration:line-through;color:var(--ink-3)}
  .when{font-size:12.5px;font-weight:700;color:var(--ink-3);white-space:nowrap;padding:4px 9px;border-radius:999px}
  .when.hot{color:#fff;background:var(--red)} .when.warm{background:var(--sun);color:var(--ink)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0;border:1.5px solid var(--line)}
  .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;border:2px solid var(--line);background:#fff}
  .tag{font-size:11.5px;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:4px;color:var(--ink);background:var(--sun-soft)}
  .tag.date{background:var(--sky)}

  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 14px calc(12px + env(safe-area-inset-bottom))}
  .tabbar .in{max-width:460px;margin:0 auto;display:flex;align-items:center;justify-content:space-around;height:66px;background:var(--card);border:2px solid var(--line);border-radius:999px;box-shadow:0 5px 0 var(--line);padding:0 6px}
  .tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:600;color:var(--ink-3);cursor:pointer;min-width:58px;padding:0 2px;white-space:nowrap}
  .qbtn,.go{font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;background:var(--sun);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:6px 12px;box-shadow:0 2px 0 var(--line);white-space:nowrap;cursor:pointer;flex:none}
  .qbtn:active{transform:translateY(2px);box-shadow:0 0 0 var(--line)}
  .day{font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;color:var(--ink);margin:14px 0 2px;padding-top:10px;border-top:2px solid rgba(18,48,26,.12)}
  .day:first-of-type{margin-top:0;padding-top:0;border-top:0}
  .day + .item{border-top:0}
  .pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1.5px dashed rgba(18,48,26,.18);padding:12px 0;cursor:pointer;color:var(--ink)}
  .pick:first-of-type{border-top:0;padding-top:2px}
  .pick .pm{flex:1;min-width:0}
  .pick .pm b{display:block;font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pick .pm span{font-size:13px;color:var(--ink-3)}
  .tab.on{color:var(--ink)}
  .plus{width:58px;height:58px;border-radius:50%;border:2px solid var(--line);background:var(--sun);color:var(--ink);cursor:pointer;margin-top:-30px;box-shadow:0 4px 0 var(--line);display:grid;place-items:center}
  .plus:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

  .sheet-bg{position:fixed;inset:0;background:rgba(18,48,26,.45);display:none;align-items:flex-end;justify-content:center;z-index:40}
  .sheet-bg.show{display:flex}
  .sheet{background:#F4FAEE;width:100%;max-width:560px;max-height:92vh;overflow:auto;border:2px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom))}
  .sheet .grab{width:44px;height:5px;border-radius:9px;background:rgba(18,48,26,.25);margin:0 auto 14px}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
  .sheet-head h2{margin:0}
  @media(min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:26px;border-bottom:2px solid var(--line);box-shadow:0 6px 0 var(--line)}.sheet .grab{display:none}}

  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed var(--ink);background:var(--card);border-radius:20px;padding:24px 12px;cursor:pointer;text-align:center}
  .drop.over{background:var(--sun-soft);border-style:solid}
  .cam{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#0a1d10;border:2px solid var(--line);border-radius:18px;margin-bottom:10px}
  .drop b{font-size:17px;font-family:Fredoka,sans-serif;font-weight:600}
  .drop span{font-size:13.5px;color:var(--ink-3)}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .thumbs div{position:relative}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:2px solid var(--line)}
  .thumbs button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:14px;line-height:1;cursor:pointer;padding:0}
  .or{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:13px;margin:14px 0;font-weight:600}
  .or:before,.or:after{content:"";flex:1;height:2px;background:rgba(18,48,26,.15);border-radius:2px}
  .kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .kinds .btn{padding:11px 8px;font-size:15px}
  textarea,input[type=text],input[type=date],input[type=password],select{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 13px;background:#fff;outline:none;font-size:15.5px}
  textarea:focus,input:focus,select:focus{box-shadow:0 0 0 4px rgba(255,214,107,.7)}
  textarea{min-height:96px;resize:vertical}
  .fl{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:12px 0 6px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .found{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
  details summary{cursor:pointer;color:var(--ink-2);font-size:14px;margin-top:12px;font-weight:600}
  .paper{display:block;width:100%;max-width:330px;margin:4px auto 6px;border:2px solid var(--line);border-radius:14px;box-shadow:0 5px 0 var(--line);transform:rotate(-1.2deg)}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font-size:13px;font-weight:600;background:var(--green-soft);border:1.5px solid var(--line);border-radius:999px;padding:4px 11px}

  .step{display:flex;gap:12px;padding:6px 0}
  .step .d{width:46px;flex:none;text-align:center}
  .step .d b{display:block;font-size:11px;color:var(--ink-3);text-transform:lowercase;letter-spacing:.03em}
  .step .d span{font-size:19px;font-weight:700;font-family:Fredoka,sans-serif}
  .step .w{flex:1;background:#fff;border:2px solid rgba(18,48,26,.15);border-radius:14px;padding:10px 12px;font-size:14.5px}
  .step.today .w{background:var(--sun-soft);border-color:var(--line)}
  .step.test .w{background:var(--ink);border-color:var(--line);color:#fff;font-weight:600}

  .q{font-size:21px;font-weight:600;line-height:1.25;margin:8px 0 14px}
  .opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px;margin:0 0 10px;cursor:pointer;font-size:15.5px;font-weight:500;box-shadow:0 3px 0 var(--line);transition:transform .1s,box-shadow .1s}
  .opt:hover:not(:disabled){transform:translateY(1px);box-shadow:0 2px 0 var(--line)}
  .opt.right{background:var(--green-soft)}
  .opt.wrong{background:var(--red-soft)}
  .opt:disabled{cursor:default}
  .why{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14.5px;margin:4px 0 14px}
  .why b{font-family:Fredoka,sans-serif;font-weight:600}
  .bar{height:10px;background:#fff;border:2px solid var(--line);border-radius:9px;overflow:hidden;margin:0 0 8px}
  .bar i{display:block;height:100%;background:var(--sun);transition:width .3s}
  .score{font-size:72px;font-weight:700;text-align:center;margin:10px 0 0;line-height:1}

  .empty{text-align:center;padding:26px 10px}
  .empty .e{display:flex;justify-content:center;margin-bottom:8px}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14.5px;font-weight:600;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:88vw;text-align:center;border:2px solid #0a1d10}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
  .spin.dark{border-color:rgba(18,48,26,.15);border-top-color:var(--ink)}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hidden{display:none !important}
  .center{text-align:center}
  .mt{margin-top:12px}
  .mt2{margin-top:26px}
  .err{background:var(--red-soft);color:#7a1f14;border:2px solid var(--red);border-radius:14px;padding:10px 12px;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="hills" aria-hidden="true"><svg viewBox="0 0 1440 150" preserveAspectRatio="none"><path d="M0,70 C240,20 420,110 720,60 C1000,15 1220,95 1440,50 L1440,150 L0,150 Z" fill="#B8E3A4"/><path d="M0,105 C300,60 520,140 820,95 C1100,55 1280,120 1440,95 L1440,150 L0,150 Z" fill="#8FD07A"/></svg></div>
<div class="wrap">
  <header>
    <button class="logo" data-tab="plans" aria-label="backpack home">backpack</button>
    <button class="iconbtn" data-act="settings" aria-label="settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="9.5" cy="17" r="2.3"/></svg></button>
  </header>
  <main id="screen"></main>
</div>

<nav class="tabbar"><div class="in">
  <button class="tab on" data-tab="plans"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>plans</button>
  <button class="tab" data-tab="homework"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg>homework</button>
  <button class="plus" data-act="add" aria-label="add something"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" data-tab="tests"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>tests</button>
  <button class="tab" data-tab="quiz"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l1.8 5.2 5.2 1.8-5.2 1.8L12 17.5l-1.8-5.2L5 10.5l5.2-1.8z"/></svg>quiz me</button>
</div></nav>

<div id="sheet" class="sheet-bg"><div class="sheet"><div class="grab"></div><div id="sheet-body"></div></div></div>
<div id="toast" class="toast"></div>
<input id="file" type="file" accept="image/*" multiple class="hidden">

<script>
(() => {
"use strict";

/* ---------- state ---------- */
const KEY = "backpack-v2", CODE_KEY = "backpack-code";
const KINDS = {hw:"Homework", test:"Test", quiz:"Quiz", project:"Project", event:"Date"};
const COLORS = ["#ff6b35","#3b82f6","#a855f7","#16a34a","#eab308","#ec4899","#14b8a6","#64748b"];
const S = { items:[], quizzes:{}, tab:"plans", photos:[], found:null, quiz:null, showDone:false, quizAfter:false };

/* ---------- little drawn icons (no emojis) ---------- */
const P = {
  pencil:'<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>',
  book:'<path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5V19c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"/><path d="M12 6v13.5"/>',
  cal:'<rect x="4" y="5.5" width="16" height="14" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>',
  camera:'<path d="M4 8.5h3l1.8-2.5h6.4L17 8.5h3v10H4z"/><circle cx="12" cy="13.3" r="3.3"/>',
  paper:'<path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M9 12h6M9 15.5h6"/>',
  spark:'<path d="M12 3.5l1.8 5.2 5.2 1.8-5.2 1.8L12 17.5l-1.8-5.2L5 10.5l5.2-1.8z"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
};
const ico = (n, s = 18, w = 2.2, c = "currentColor") => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const BAG = `<svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><path d="M24 14v-3a8 8 0 0 1 16 0v3" fill="none" stroke="#12301A" stroke-width="3.5"/><rect x="12" y="14" width="40" height="44" rx="14" fill="#FFD66B" stroke="#12301A" stroke-width="3.5"/><path d="M12 30c8 4 32 4 40 0" fill="none" stroke="#12301A" stroke-width="3.5"/><rect x="20" y="38" width="24" height="13" rx="5" fill="#FFFBF1" stroke="#12301A" stroke-width="3.5"/><path d="M28 44.5h8" stroke="#12301A" stroke-width="3.5" stroke-linecap="round"/></svg>`;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const t0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const parse = s => { if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const days = s => { const d = parse(s); return d ? Math.round((d - t0())/864e5) : null; };
const wk = d => d.toLocaleDateString(undefined, {weekday:"long"});
const short = d => d.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
const isTest = i => i.kind === "test" || i.kind === "quiz";
const isDate = i => i.kind === "event";
const canQuiz = i => !isDate(i);
const kindWord = k => (KINDS[k] || "Homework").toLowerCase();
function when(s){
  const n = days(s);
  if (n === null) return {t:"no date", c:""};
  if (n < 0) return {t: n === -1 ? "yesterday" : `${-n}d late`, c:"hot"};
  if (n === 0) return {t:"today", c:"hot"};
  if (n === 1) return {t:"tomorrow", c:"warm"};
  if (n < 7) return {t: wk(parse(s)).toLowerCase(), c: n <= 3 ? "warm" : ""};
  return {t: short(parse(s)).toLowerCase(), c:""};
}
function color(subj){
  const subs = [...new Set(S.items.map(i => (i.subject||"").toLowerCase()))].sort();
  const k = subs.indexOf((subj||"").toLowerCase());
  return COLORS[(k < 0 ? 0 : k) % COLORS.length];
}

/* ---------- AI (through our own /api/ai) ---------- */
async function ai(payload){
  const r = await fetch("/api/ai", {method:"POST", headers:{"content-type":"application/json", "x-access-code": getCode()}, body: JSON.stringify(payload)});
  let data = {}; try { data = await r.json(); } catch {}
  if (r.status === 401) { const e = new Error(data.message || "access code needed"); e.code = "code"; throw e; }
  if (!r.ok) throw new Error(data.message || "something went wrong. try again?");
  return data;
}

async function toJpegB64(file){
  const bmp = await createImageBitmap(file);
  const max = 1280, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.8).split(",")[1];
}

/* ---------- planning (instant, no AI) ---------- */
function related(test){
  const subj = (test.subject||"").toLowerCase().trim();
  const tops = new Set((test.topics||[]).map(t => t.toLowerCase()));
  return S.items.filter(i => i.id !== test.id && !isTest(i) && !isDate(i) && ((subj && (i.subject||"").toLowerCase().trim() === subj) || (i.topics||[]).some(t => tops.has(t.toLowerCase()))));
}
function plan(test){
  const n = days(test.due), out = [];
  if (n === null || n < 0) return out;
  const T = [...new Set([...(test.topics||[]), ...related(test).flatMap(r => r.topics||[])])].slice(0, 8);
  const tops = T.length ? T : ["everything on the test"];
  if (n === 0) return [{d:t0(), w:"warm up: one quick practice quiz, then look over what you missed.", test:true}];
  const sd = Math.min(n, 7), start = n - sd, learn = sd >= 3 ? sd - 2 : sd - 1;
  for (let k = 0; k < sd; k++) {
    const left = sd - k; let w;
    if (left === 1) w = "final review: take a practice quiz and re-study what you miss.";
    else if (left === 2 && sd >= 3) w = "practice quiz, then fix your weak spots.";
    else { const c = tops.filter((_, i) => i % learn === k); w = "study " + (c.length ? c : [tops[k % tops.length]]).join(", "); }
    out.push({d: addDays(t0(), start + k), w});
  }
  out.push({d: addDays(t0(), n), w: `${kindWord(test.kind)} day: ${test.title}`, test:true});
  return out;
}
function tonight(){
  const out = [];
  S.items.filter(i => !i.done).forEach(i => {
    const n = days(i.due);
    if (isDate(i)) { if (n !== null && n >= 0 && n <= 1) out.push({id:i.id, t:i.title, s:`heads up · ${when(i.due).t}`, n, ic:"cal"}); return; }
    if (!isTest(i)) { if (n !== null && n <= 1) out.push({id:i.id, t:`finish ${i.title}`, s:`${i.subject} · due ${when(i.due).t}`, n, ic:"pencil"}); return; }
    if (n === null || n < 0 || n > 7) return;
    const p = plan(i).find(x => ymd(x.d) === ymd(t0()));
    if (p) out.push({id:i.id, t:p.w, s:`for ${i.title} · ${when(i.due).t}`, n, ic:"book", quiz:/quiz/i.test(p.w)});
  });
  return out.sort((a,b) => a.n - b.n).slice(0, 5);
}

  const tag = isTest(i) ? `<span class="tag">${kindWord(i.kind)}</span>` : isDate(i) ? `<span class="tag date">date</span>` : i.kind === "project" ? `<span class="tag">project</span>` : "";

    : mode === "plan" ? "" : `<div class="when ${i.done?"":w.c}">${i.done?"":esc(w.t)}</div>`;

function dayLabel(s){

  if (n === 0) return "today";

}

  const ev = isDate(i);
  return `<div class="two">
      <div><label class="fl">type</label><select data-f="kind" data-k="${k}">${Object.entries(KINDS).map(([v,l]) => `<option value="${v}" ${i.kind===v?"selected":""}>${l.toLowerCase()}</option>`).join("")}</select></div>
      <div><label class="fl">${ev ? "when" : "due"}</label><input type="date" data-f="due" data-k="${k}" value="${esc(i.due||"")}"></div></div>
    <label class="fl">title</label><input type="text" data-f="title" data-k="${k}" value="${esc(i.title)}" placeholder="${ev ? "e.g. field trip, no school, permission slip due" : i.kind === "test" ? "e.g. unit 4 test" : "e.g. chapter 5 worksheet"}">
    <label class="fl">class${ev ? " (optional)" : ""}</label><input type="text" data-f="subject" data-k="${k}" value="${esc(i.subject)}" placeholder="e.g. biology">
    <details ${i.notes || ev ? "" : "open"}><summary>${ev ? "notes" : "topics & notes (quizzes use these)"}</summary>
      ${ev ? "" : `<label class="fl">topics, separated by commas</label><input type="text" data-f="topics" data-k="${k}" value="${esc((i.topics||[]).join(", "))}">`}
      <label class="fl">notes</label><textarea data-f="notes" data-k="${k}">${esc(i.notes||"")}</textarea></details>`;
}
function foundSheet(manual){
  const F = S.found;
  openSheet(`<div class="sheet-head"><h2>${manual ? `add a ${kindWord(F[0].kind)}` : F.length > 1 ? `found ${F.length} things!` : "look right?"}</h2><button class="link" data-act="close">close</button></div>
    <p class="muted" style="margin:0 0 12px">${manual ? "fill it in, then save." : "check the dates, then save."}</p>
    ${F.map((i,k) => `<div class="found">${fields(i,k)}${F.length>1?`<div class="center"><button class="link" data-rmfound="${k}">remove</button></div>`:""}</div>`).join("")}
    <button class="btn" data-act="save-found">${S.quizAfter ? `${ico("spark", 18)}save & quiz me` : `save${F.length > 1 ? " all" : ""}`}</button>`);
}
function editSheet(id){
  const i = S.items.find(x => x.id === id); if (!i) return;
  S.editing = JSON.parse(JSON.stringify(i));
  openSheet(`<div class="sheet-head"><h2>edit</h2><button class="link" data-act="close">close</button></div>
    ${fields(S.editing, "e")}
    <button class="btn mt" data-act="save-edit">save</button>
    ${canQuiz(i) && !isTest(i) ? `<button class="btn light mt" data-act="quiz" data-id="${esc(id)}">${ico("spark", 18)}practice quiz on this</button>` : ""}
    <div class="center"><button class="link" data-act="delete" data-id="${esc(id)}" style="color:var(--red)">delete</button></div>`);
}
function clean(x){
  return { id: uid(), kind: KINDS[x && x.kind] ? x.kind : "hw", title: String(x && x.title || "").slice(0,120), subject: String(x && x.subject || "").slice(0,40),
    due: parse(x && x.due) ? x.due : null, topics: Array.isArray(x && x.topics) ? x.topics.map(String).filter(Boolean).slice(0,8) : [],
    notes: String(x && x.notes || "").slice(0,1500), done:false, at: Date.now() };
}

async function read(){
  const text = ($("#paste") ? $("#paste").value : "").trim();
  S.draft = text;
  if (!text && !S.photos.length) return toast("add a photo or type something first");
  const b = $("#read"); b.disabled = true; b.innerHTML = `<span class="spin"></span>reading…`;
  try {
    const images = [];
    for (const f of S.photos) {
      try { images.push({media_type:"image/jpeg", data: await toJpegB64(f)}); }
      catch { throw new Error("couldn't open that photo. if it's an iPhone photo, try Safari, or take a screenshot of it and paste that instead."); }
    }
    const t = t0();
    const r = await ai({task:"extract", text, images, today: ymd(t), weekday: wk(t)});
    const list = (r.items||[]).map(clean).filter(i => i.title);
    if (!list.length) throw new Error("couldn't find any homework in that. try a clearer photo, or add it yourself.");
    S.found = list; foundSheet();
  } catch (e) {
    if (e.code === "code") return askCode(() => { addSheet(); read(); });
    addSheet(e.message);
  }
}

async function startQuiz(id){
  const t = S.items.find(x => x.id === id); if (!t) return;
  S.quiz = {id, i:0, pick:null, score:0, missed:[], qs:null};
  quizSheet();
  try {
    const pick = o => ({kind:o.kind, title:o.title, subject:o.subject, topics:o.topics, notes:o.notes});
    // tests pull in the related homework; a single homework gets quizzed on just itself
    const r = await ai({task:"quiz", test: pick(t), related: isTest(t) ? related(t).slice(0,6).map(pick) : []});
    const qs = (r.questions||[]).filter(q => q && q.q && Array.isArray(q.options) && q.options.length >= 2 && Number.isInteger(+q.answer) && +q.answer >= 0 && +q.answer < q.options.length).map(q => ({...q, answer:+q.answer}));
    if (!qs.length) throw new Error("couldn't make a quiz. add a few notes or topics first.");
    if (S.quiz && S.quiz.id === id) { S.quiz.qs = qs; quizSheet(); }
  } catch (e) {
    if (e.code === "code") return askCode(() => startQuiz(id));
    if (S.quiz) { S.quiz.err = e.message; quizSheet(); }
  }
}
function quizSheet(){
  const Q = S.quiz; if (!Q) return;
  const t = S.items.find(x => x.id === Q.id) || {};
  const head = `<div class="sheet-head"><div><div class="muted" style="font-size:12.5px;font-weight:600">practice quiz</div><h2>${esc(t.title)}</h2></div><button class="link" data-act="close">close</button></div>`;
  if (Q.err) return openSheet(head + `<div class="err">${esc(Q.err)}</div><button class="btn mt" data-act="quiz" data-id="${esc(Q.id)}">try again</button>`);
  if (!Q.qs) return openSheet(head + `<div class="empty"><div class="e">${BAG}</div><p class="muted"><span class="spin dark"></span>making questions from your homework…</p></div>`);
  if (Q.i >= Q.qs.length) {
    const pct = Q.score / Q.qs.length, weak = [...new Set(Q.missed)];
    return openSheet(head + `<div class="score">${Q.score}/${Q.qs.length}</div>
      <p class="center muted">${pct>=.9?"you're so ready.":pct>=.7?"solid! fix a couple spots and you've got it.":pct>=.5?"getting there. look over these:":"good thing you practiced. focus on these:"}</p>
      ${weak.length ? `<div class="chips" style="justify-content:center">${weak.map(w => `<span class="chip">${esc(w)}</span>`).join("")}</div>` : ""}
      <button class="btn mt" data-act="quiz" data-id="${esc(Q.id)}">new quiz</button>
      <button class="btn light mt" data-act="close">done</button>`);
  }
  const q = Q.qs[Q.i], a = Q.pick !== null;
  openSheet(head + `<div class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>
    <div class="muted" style="font-size:13px">${Q.i+1} of ${Q.qs.length}${q.topic?" · "+esc(q.topic):""}</div>
    <div class="q">${esc(q.q)}</div>
    ${q.options.map((o,k) => `<button class="opt ${a?(k===q.answer?"right":k===Q.pick?"wrong":""):""}" data-pick="${k}" ${a?"disabled":""}>${esc(o)}</button>`).join("")}
    ${a ? `<div class="why"><b>${Q.pick===q.answer?"nice!":"not quite."}</b> ${esc(q.explain||"")}${q.from?`<div class="muted" style="margin-top:6px;font-size:12.5px">from your homework: ${esc(q.from)}</div>`:""}</div>
    <button class="btn" data-act="next">${Q.i+1===Q.qs.length?"see my score":"next"}</button>` : ""}`);
}

/* ---------- example week ---------- */
function clearDemo(){
  S.items.filter(i => i.demo).forEach(i => delete S.quizzes[i.id]);
  S.items = S.items.filter(i => !i.demo);
}
function demo(){
  clearDemo();
  const d = n => ymd(addDays(t0(), n)), mk = o => ({...clean(o), demo:true});
  S.items.push(
    mk({kind:"hw", title:"Cellular respiration worksheet", subject:"Biology", due:d(1), topics:["Glycolysis","Krebs cycle","Electron transport chain","ATP"], notes:"C6H12O6 + 6O2 → 6CO2 + 6H2O + ATP. Glycolysis: cytoplasm, glucose → 2 pyruvate, net 2 ATP + 2 NADH, no oxygen needed. Krebs cycle: mitochondrial matrix, makes CO2, NADH, FADH2, 2 ATP. Electron transport chain: inner mitochondrial membrane, oxygen is the final electron acceptor (makes water), ~32-34 ATP via ATP synthase. No oxygen → fermentation (lactic acid in muscles, alcohol in yeast)."}),
    mk({kind:"hw", title:"Photosynthesis reading questions", subject:"Biology", due:d(3), topics:["Photosynthesis","Light reactions","Calvin cycle"], notes:"6CO2 + 6H2O + light → C6H12O6 + 6O2. Light reactions in thylakoid membranes: split water, release O2, make ATP + NADPH. Calvin cycle in the stroma: uses ATP + NADPH to fix CO2 into sugar (G3P), enzyme rubisco. Chlorophyll absorbs red and blue light, reflects green."}),
    mk({kind:"test", title:"Unit 4 Test: Cell Energy", subject:"Biology", due:d(5), topics:["Cellular respiration","Photosynthesis","ATP","Fermentation"], notes:"Respiration vs photosynthesis, where each stage happens, inputs/outputs, ATP yields, fermentation."}),
    mk({kind:"hw", title:"Unit circle practice #1-20", subject:"Precalc", due:d(2), topics:["Unit circle","Radians","Reference angles"], notes:"Radians = degrees × π/180. Unit circle point = (cos θ, sin θ). sin(π/6)=1/2, cos(π/6)=√3/2, sin(π/4)=cos(π/4)=√2/2, sin(π/3)=√3/2, cos(π/3)=1/2. Reference angle = acute angle to the x-axis. All Students Take Calculus: all positive QI, sin QII, tan QIII, cos QIV."}),
    mk({kind:"quiz", title:"Trig quiz", subject:"Precalc", due:d(4), topics:["Unit circle","Radians","Reference angles"], notes:"Unit circle values, degrees ↔ radians, signs by quadrant."}),
    mk({kind:"project", title:"Essay draft: The Outsiders", subject:"English", due:d(6), topics:["Theme","Thesis","Evidence"], notes:"Thesis about a theme (class divide, loyalty, growing up). 3 body paragraphs with quotes + analysis."}),
    mk({kind:"hw", title:"Vocab list 7", subject:"English", due:d(0), topics:["Vocabulary"], notes:"Write each word's definition and use it in a sentence. benevolent: kind and generous. candid: honest and direct. diligent: hardworking and careful. elated: very happy. futile: pointless, having no effect. meticulous: paying close attention to detail. ominous: suggesting something bad will happen. reluctant: unwilling, hesitant. tenacious: not giving up easily. vivid: bright, clear and detailed."}),
    mk({kind:"event", title:"Field trip: science museum", subject:"", due:d(1), notes:"Bring the signed permission slip and a lunch."}),
    mk({kind:"event", title:"No school (teacher work day)", subject:"", due:d(7), notes:""}),
  );
  S.tab = "plans"; save(); render(); window.scrollTo(0,0); toast("example week added. poke around!");
}

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act],[data-tab],[data-pick],[data-rm],[data-rmfound]");
  if (!el) { if (ev.target.id === "sheet") closeSheet(); return; }
  if (el.dataset.tab) { S.tab = el.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (el.dataset.pick !== undefined) { const Q = S.quiz; if (!Q || Q.pick !== null) return; const q = Q.qs[Q.i]; Q.pick = +el.dataset.pick; if (Q.pick === q.answer) Q.score++; else Q.missed.push(q.topic || "review"); return quizSheet(); }
  if (el.dataset.rm !== undefined) { S.draft = $("#paste") ? $("#paste").value : S.draft; S.photos.splice(+el.dataset.rm, 1); return addSheet(); }
  if (el.dataset.rmfound !== undefined) { S.found.splice(+el.dataset.rmfound, 1); return S.found.length ? foundSheet() : closeSheet(); }
  const row = el.closest("[data-id]"), id = el.dataset.id || (row && row.dataset.id), act = el.dataset.act;
  switch (act) {
    case "add": S.quizAfter = false; S.photos = []; S.draft = ""; addSheet(); break;
    case "quiz-new": S.quizAfter = true; S.photos = []; S.draft = ""; addSheet(); break;
    case "read": read(); break;
    case "add-kind": { const k = el.dataset.kind || "hw"; S.found = [clean({kind:k, due: ymd(addDays(t0(), k === "hw" ? 1 : 7))})]; foundSheet(true); break; }
    case "paper": S.quizAfter = el.dataset.quiz === "1" ? true : el.dataset.keep ? S.quizAfter : false; paperSheet(); break;
    case "cam": camSheet(); break;
    case "snap": snap(); break;
    case "cam-back": stopCam(); addSheet(); break;
    case "paper-read": paperBlob().then(b => { S.photos = [b]; S.draft = ""; addSheet(); read(); }); break;
    case "close": closeSheet(); break;
    case "toggle": { const i = S.items.find(x => x.id === id); if (i) { i.done = !i.done; save(); render(); if (i.done) toast("done! nice work."); } break; }
    case "edit": editSheet(id); break;
    case "quiz": startQuiz(id); break;
    case "next": { const Q = S.quiz; Q.i++; Q.pick = null; if (Q.i >= Q.qs.length) { (S.quizzes[Q.id] ||= []).push({score:Q.score, total:Q.qs.length, missed:Q.missed, at:Date.now()}); S.quizzes[Q.id] = S.quizzes[Q.id].slice(-10); save(); render(); } quizSheet(); break; }
    case "save-found": {
      const ok = S.found.filter(i => i.title.trim());
      if (!ok.length) return toast("give it a title first");
      ok.forEach(i => { i.title = i.title.trim(); i.subject = (i.subject||"").trim() || (isDate(i) ? "" : "Other"); S.items.push(i); });
      const qm = S.quizAfter; S.quizAfter = false;
      save(); closeSheet(); S.found = null; S.photos = []; S.draft = ""; window.scrollTo(0,0);
      const first = ok.find(canQuiz);
      if (qm && first) { S.tab = "quiz"; render(); startQuiz(first.id); break; }
      S.tab = ok.some(i => !isTest(i) && !isDate(i)) ? "homework" : ok.some(isTest) ? "tests" : "plans";
      render(); toast(S.tab === "homework" ? "saved! it's in your homework." : S.tab === "tests" ? "saved! it's in your tests." : "saved! it's in your plans."); break;
    }
    case "save-edit": { const e = S.editing, i = S.items.find(x => x.id === e.id); if (i) { Object.assign(i, {kind:e.kind, title:(e.title||"").trim()||i.title, subject:(e.subject||"").trim()||(isDate(e) ? "" : "Other"), due:e.due||null, topics:e.topics||[], notes:e.notes||""}); save(); render(); } closeSheet(); toast("saved"); break; }
    case "delete": if (el.dataset.sure) { S.items = S.items.filter(x => x.id !== id); delete S.quizzes[id]; save(); render(); closeSheet(); toast("deleted"); } else { el.dataset.sure = 1; el.textContent = "tap again to delete"; } break;
    case "show-done": S.showDone = !S.showDone; render(); break;
    case "clear-done": S.items = S.items.filter(i => !i.done); save(); render(); break;
    case "demo": demo(); break;
    case "clear-demo": clearDemo(); save(); closeSheet(); render(); toast("example week cleared"); break;
    case "save-code": { const c = ($("#code").value||"").trim(); if (!c) return toast("enter the code"); setCode(c); closeSheet(); const f = S.afterCode; S.afterCode = null; if (f) f(); else toast("unlocked"); break; }
    case "settings": openSheet(`<div class="sheet-head"><h2>settings</h2><button class="link" data-act="close">close</button></div>
      <button class="btn light" data-act="demo-close">${ico("cal", 18)}add the example week</button>
      <button class="btn light mt" data-act="paper">${ico("paper", 18)}see the example homework page</button>
      ${S.items.some(i => i.demo) ? `<button class="btn light mt" data-act="clear-demo">clear the example week</button>` : ""}
      <button class="btn light mt" data-act="reset" style="color:var(--red)">erase everything</button>
      <p class="muted center mt">your stuff is saved on this device only.</p>`); break;
    case "change-code": askCode(null); break;
    case "demo-close": closeSheet(); demo(); break;
    case "reset": if (el.dataset.sure) { S.items = []; S.quizzes = {}; save(); closeSheet(); render(); toast("fresh start"); } else { el.dataset.sure = 1; el.textContent = "tap again to erase everything"; } break;
  }
});
document.addEventListener("input", ev => {
  const el = ev.target; if (!el.dataset || !el.dataset.f) return;
  const tgt = el.dataset.k === "e" ? S.editing : S.found && S.found[+el.dataset.k]; if (!tgt) return;
  const f = el.dataset.f;
  if (f === "topics") tgt.topics = el.value.split(",").map(s => s.trim()).filter(Boolean).slice(0,8);
  else tgt[f] = f === "due" ? (el.value || null) : el.value;
});
document.addEventListener("change", ev => { if (ev.target.tagName === "SELECT" || ev.target.type === "date") ev.target.dispatchEvent(new Event("input", {bubbles:true})); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); if (e.key === "Enter" && e.target.id === "code") document.querySelector("[data-act=save-code]").click(); });
$("#file").addEventListener("change", e => { const f = [...e.target.files]; e.target.value = ""; if (f.length) addPhotos(f); });
// drag a picture anywhere onto the add sheet
const addOpen = () => $("#sheet").classList.contains("show") && $(".drop");
document.addEventListener("dragover", e => { if (!addOpen()) return; e.preventDefault(); $(".drop").classList.add("over"); });
document.addEventListener("dragleave", e => { if (addOpen() && !e.relatedTarget) $(".drop").classList.remove("over"); });
document.addEventListener("drop", e => { if (!addOpen()) return; e.preventDefault(); $(".drop").classList.remove("over"); addPhotos(e.dataTransfer.files); });
// paste a copied screenshot (Cmd+Ctrl+Shift+4 on a Mac, then Cmd+V)
document.addEventListener("paste", e => {
  if (!addOpen()) return;
  const f = [...((e.clipboardData && e.clipboardData.files) || [])].filter(x => x.type.startsWith("image/"));
  if (!f.length) return;
  e.preventDefault(); if (addPhotos(f)) toast("screenshot added");
});

load(); render();
})();
</script>
</body>
</html>
